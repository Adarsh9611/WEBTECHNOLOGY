<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to My Homepage</title>

<!-- Stylesheets Combined -->
<style id="style1">
body { background: #f2f2f2; font-family: Arial; }
nav button.active { background: orange; color: white; }
</style>

<style id="style2" disabled>
body { background: #d0ebff; font-family: Georgia; }
nav button.active { background: blue; color: white; }
</style>

<style id="style3" disabled>
body { background: #ffe6e6; font-family: "Courier New"; }
nav button.active { background: red; color: white; }
</style>

<style id="style4" disabled>
body { background: black; color: white; }
nav button.active { background: lime; color: black; }
</style>

<style>
/* Base layout (applies always) */
.container { display: flex; gap: 20px; padding: 20px; }
nav { display: flex; flex-direction: column; gap: 10px; }
nav button { padding: 10px; cursor: pointer; }
aside { width: 200px; }
</style>

</head>

<body>

<header>
 <h1>Welcome to My Homepage</h1>
 <p>Use the menu to select different Stylesheets</p>
</header>

<div class="container">

 <!-- Left Menu -->
 <nav>
  <button onclick="applyStyle('style1', this)" class="active">Stylesheet 1</button>
  <button onclick="applyStyle('style2', this)">Stylesheet 2</button>
  <button onclick="applyStyle('style3', this)">Stylesheet 3</button>
  <button onclick="applyStyle('style4', this)">Stylesheet 4</button>
  <button onclick="removeStyles(this)">No Stylesheet</button>
 </nav>

 <!-- Main Content -->
 <main>
  <h2>Same Page Different Stylesheets</h2>
  <p>This is a demonstration of how different stylesheets can change the layout.</p>
 </main>

 <!-- Side-Bar -->
 <aside>
  <h3>Side-Bar</h3>
  <p>Lorem ipsum dolor sit amet, consectetuer adipiscing elit.</p>
 </aside>

</div>

<script>
// Enable only selected style
function applyStyle(id, btn) {
  document.querySelectorAll("style[id^='style']").forEach(s => s.disabled = true);
  document.getElementById(id).disabled = false;

  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

// Disable all styles
function removeStyles(btn) {
  document.querySelectorAll("style[id^='style']").forEach(s => s.disabled = true);

  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}
</script>

</body>
</html>
